name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test without production credentials
        run: python -m unittest discover -s tests -v
      - name: Validate Compose and deployment scripts
        run: |
          docker compose --profile webhook config --format json | python scripts/check_compose.py
          bash -n scripts/pull-release.sh scripts/deploy-server.sh
          python -m unittest discover -s scripts/tests -v
      - name: Validate ngrok configuration without connecting an account
        run: |
          docker compose -f compose.ngrok.yaml config --format json | python scripts/check_ngrok.py "$RUNNER_TEMP/ngrok-test"
          image=$(docker compose -f compose.ngrok.yaml config --images)
          docker run --rm --network host --read-only -v "$RUNNER_TEMP/ngrok-test:/run/ngrok:ro" "$image" config check --config /run/ngrok/config.yml
      - name: Build application image
        run: |
          docker build --network host -t mail-summary-agent:ci .
          bundle=$(docker create --network host mail-summary-agent:ci)
          docker cp "$bundle:/opt/deployment/." "$RUNNER_TEMP/deployment"
          docker rm "$bundle"
          test -f "$RUNNER_TEMP/deployment/scripts/pull-release.sh"
          cmp compose.yaml "$RUNNER_TEMP/deployment/compose.yaml"
          cmp compose.ngrok.yaml "$RUNNER_TEMP/deployment/compose.ngrok.yaml"
          test -f "$RUNNER_TEMP/deployment/ngrok_setup.py"
          cmp gmail_api.py "$RUNNER_TEMP/deployment/gmail_api.py"
          docker run --rm --network host --entrypoint python mail-summary-agent:ci -c 'import mailagent; assert mailagent.gmail_api_client().__class__.__name__ == "GmailAPI"'
          docker run --rm --network host --entrypoint python mail-summary-agent:ci -c 'from pathlib import Path; assert not Path("/app/dashboard.py").exists(); assert not Path("/app/frontend").exists()'
          test -f "$RUNNER_TEMP/deployment/dashboard.py"
          test -f "$RUNNER_TEMP/deployment/demo_dashboard.py"

  publish:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable revision
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

